{% extends 'core/base.html' %}

{% block title %}Erro{% endblock %}

{% block content %}
<div class="container-erro">
    <div class="conteudo-erro">
        <h1>⚠️ Erro</h1>
        <p class="mensagem-erro">{{ mensagem }}</p>
        <a href="{% url 'inicio' %}" class="botao botao-primario">
            Voltar para a página inicial
        </a>
    </div>
</div>

<style>
.container-erro {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 400px;
    padding: 20px;
}

.conteudo-erro {
    background-color: #f9f9f9;
    border: 2px solid #f44;
    border-radius: 8px;
    padding: 40px;
    text-align: center;
    max-width: 500px;
}

.conteudo-erro h1 {
    margin-top: 0;
    color: #c33;
}

.mensagem-erro {
    color: #333;
    font-size: 16px;
    margin: 20px 0;
}

.botao {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
    text-align: center;
    transition: background-color 0.2s;
}

.botao-primario {
    background-color: #4285F4;
    color: white;
}

.botao-primario:hover {
    background-color: #2d5dc8;
}
</style>
{% endblock %}
